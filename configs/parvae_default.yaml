# Default PAR-VAE Configuration
# Override with: python scripts/train_parvae.py --config configs/parvae_default.yaml

data:
  dataset_type: "ct_patches"
  data_dir: "data/mosmeddata"
  image_size: 512
  patch_size: 32
  normalize_hu: true
  augmentation: true
  split_ratio: [0.70, 0.15, 0.15]

model:
  name: "PARVAE"
  encoder_type: "resnet"
  decoder_type: "deconvolution"
  latent_dim: 85
  input_channels: 1
  hidden_dims: [32, 64, 128, 256]
  max_pool: true
  batch_norm: true

training:
  epochs: 50
  batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  optimizer: "adam"
  scheduler: "cosine_annealing"
  warmup_epochs: 5
  mixed_precision: false

loss:
  reconstruction_loss: "mse"
  kl_weight: 1.0
  physics_weight: 1.5
  annealing_schedule: "three_phase"
  annealing_phases:
    - phase: "physics_first"
      epochs: [0, 20]
      beta_range: [1.0e-4, 2.0e-4]
      lambda_range: [1.5, 1.5]
    - phase: "gradual_balance"
      epochs: [20, 40]
      beta_range: [2.0e-4, 5.0e-4]
      lambda_range: [1.5, 3.0]
    - phase: "fine_tune"
      epochs: [40, 50]
      beta_range: [5.0e-4, 5.0e-4]
      lambda_range: [3.0, 3.0]

validation:
  val_every_n_epochs: 1
  early_stopping: true
  early_stopping_patience: 10
  monitor_metric: "val_kl_divergence"

physics:
  num_features: 14
  feature_types:
    - "tissue_density"  # 7 features
    - "lung_geometry"   # 2 features
    - "boundary_sharpness"  # 2 features
    - "texture"         # 3 features
  compute_every_n_batches: 10

regularization:
  dropout_rate: 0.1
  l1_penalty: 0.0
  l2_penalty: 1.0e-5

device:
  cuda: true
  device_id: 0
  distributed: false
  num_workers: 8

logging:
  log_dir: "experiments/logs"
  save_every_n_epochs: 5
  save_best_model: true
  tensorboard: true
  wandb: false

reproducibility:
  seed: 42
  torch_deterministic: true
  torch_benchmark: false

inference:
  test_time_augmentation: false
  return_latent: true
